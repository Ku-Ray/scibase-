<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン | SciBase</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans',
          'Yu Gothic UI', sans-serif;
        background: #ffffff;
        color: #0f172a;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      img { width: 64px; height: 64px; margin-bottom: 1.25rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { font-size: .95rem; line-height: 1.7; margin: 0 0 1.5rem; color: #475569; }
      a {
        display: inline-block;
        padding: .65rem 1.25rem;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        border-radius: 9999px;
        font-size: .9rem;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f1f5f9; }
        p { color: #94a3b8; }
        a { background: #f1f5f9; color: #0f172a; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo/symbol-dark-192.png" alt="SciBase" />
      <h1>オフラインです</h1>
      <p>ネットワーク接続を確認してください。一度開いた成分ページはキャッシュから閲覧できる場合があります。</p>
      <a href="/">トップに戻る</a>
    </main>
  </body>
</html>
